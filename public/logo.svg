  <circle cx="58" cy="58" r="24.5" fill="#0f172a" />
  <circle cx="58" cy="58" r="22.5" fill="url(#ll-lens-iris)" />

  <ellipse cx="52" cy="50" rx="5.5" ry="8" transform="rotate(-30 52 50)" fill="#ffffff" opacity="0.85" />
