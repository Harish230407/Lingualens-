      <stop offset="70%" stopColor="#4f46e5" />
      <stop offset="100%" stopColor="#7c3aed" />
    </linearGradient>
    <linearGradient id="ll-ring-grad" x1="10" y1="45" x2="110" y2="75" gradientUnits="userSpaceOnUse">
