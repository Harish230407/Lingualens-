      <stop offset="60%" stopColor="#c084fc" />
      <stop offset="85%" stopColor="#fb923c" />
      <stop offset="100%" stopColor="#f97316" />
    </linearGradient>
    <radialGradient id="ll-lens-iris" cx="50" cy="50" r="28" gradientUnits="userSpaceOnUse">
